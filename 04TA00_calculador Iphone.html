<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora POO</title>
    <link rel="stylesheet" href="./assets/css/styleCalculadora.css">
</head>

<body>
    <div class="calculator">
        <div class="display-wrapper">
            <div class="display-expr" id="expression"></div>
            <div class="display" id="display">0</div>
        </div>

        <div class="main-layout">

            <!-- Scientific panel (visible in landscape) -->
            <div class="scientific-panel" id="sci-panel">
                <div class="sci-label">Científica</div>
                <div class="sci-grid">
                    <button class="sci-btn" data-sci="sin">sin</button>
                    <button class="sci-btn" data-sci="cos">cos</button>
                    <button class="sci-btn" data-sci="tan">tan</button>
                    <button class="sci-btn" data-sci="asin">asin</button>
                    <button class="sci-btn" data-sci="acos">acos</button>
                    <button class="sci-btn" data-sci="atan">atan</button>
                    <button class="sci-btn" data-sci="log">log</button>
                    <button class="sci-btn" data-sci="ln">ln</button>
                    <button class="sci-btn" data-sci="sqrt">√</button>
                    <button class="sci-btn" data-sci="pow">xʸ</button>
                    <button class="sci-btn" data-sci="pi">π</button>
                    <button class="sci-btn" data-sci="e">e</button>
                    <button class="sci-btn" data-sci="(">(</button>
                    <button class="sci-btn" data-sci=")">)</button>
                    <button class="sci-btn" data-sci="pct">%</button>
                </div>
            </div>

            <!-- Basic panel -->
            <div class="basic-panel">
                <div class="basic-grid">
                    <!-- Row 1 -->
                    <button class="btn-clear" data-action="clear">C</button>
                    <button class="btn-back" data-action="back">⌫</button>
                    <button class="btn-op" data-op="/">÷</button>

                    <!-- Row 2 -->
                    <button data-num="7">7</button>
                    <button data-num="8">8</button>
                    <button data-num="9">9</button>
                    <button class="btn-op" data-op="*">×</button>

                    <!-- Row 3 -->
                    <button data-num="4">4</button>
                    <button data-num="5">5</button>
                    <button data-num="6">6</button>
                    <button class="btn-op" data-op="-">−</button>

                    <!-- Row 4 -->
                    <button data-num="1">1</button>
                    <button data-num="2">2</button>
                    <button data-num="3">3</button>
                    <button class="btn-op" data-op="+">+</button>

                    <!-- Row 5 -->
                    <button data-num="0">0</button>
                    <button data-num=".">.</button>
                    <button class="btn-eq" data-action="equals">=</button>
                </div>
            </div>

        </div>
    </div>

    <script src="./assets/js/main.js"></script>
</body>
</html>
